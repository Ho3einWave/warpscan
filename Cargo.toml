[package]
name = "warpscan"
version = "0.2.0"
edition = "2021"
description = "Cloudflare WARP endpoint scanner with real handshakes, data-plane throughput, and MASQUE ranking"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "process", "io-util"] }
boringtun = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }

[profile.release]
opt-level = 3
lto = "thin"
